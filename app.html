<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZENAI — AI Chat</title><style>body{margin:0;background:#090d18;color:#f4f7fb;font:16px system-ui,sans-serif}.wrap{width:min(900px,calc(100% - 28px));margin:auto;padding:24px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:.12em}.muted{color:#a4b0c3;font-size:14px}.card{background:#111827;border:1px solid #263248;border-radius:18px;padding:18px}.messages{min-height:360px;max-height:55vh;overflow:auto;display:grid;gap:12px;margin-bottom:14px}.msg{padding:13px 15px;border-radius:14px;white-space:pre-wrap}.user{background:#263b68;margin-left:12%}.ai{background:#172337;margin-right:12%}.composer{display:grid;gap:10px}.composer textarea{min-height:90px;resize:vertical;padding:13px;border-radius:12px;border:1px solid #34435d;background:#0c1423;color:white;font:inherit}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}.btn{padding:11px 15px;border:0;border-radius:11px;background:#6d8cff;color:#07111e;font-weight:800;cursor:pointer}.btn.secondary{background:#ffffff0b;border:1px solid #34435d;color:#fff}.status{font-size:13px;color:#9aa8bd;min-height:20px}</style></head><body><main class="wrap"><div class="top"><div><div class="brand">ZENAI</div><div id="account" class="muted">Hisob yuklanmoqda…</div></div><button id="logout" class="btn secondary">Chiqish</button></div><section class="card"><div class="row"><strong>AI Chat</strong><span id="usage" class="muted"></span></div><div id="messages" class="messages"></div><div class="composer"><textarea id="message" placeholder="Savolingizni o‘zbek tilida yozing…"></textarea><div class="row"><span id="status" class="status"></span><button id="send" class="btn">Yuborish</button></div></div></section><script type="module">import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'; const SUPABASE_URL=window.ZENAI_SUPABASE_URL||''; const SUPABASE_ANON_KEY=window.ZENAI_SUPABASE_ANON_KEY||''; const API_BASE=window.ZENAI_API_BASE||'http://localhost:3000'; const supabase=createClient(SUPABASE_URL||'https://placeholder.invalid',SUPABASE_ANON_KEY||'placeholder'); const account=document.querySelector('#account'),usage=document.querySelector('#usage'),status=document.querySelector('#status'),messages=document.querySelector('#messages'),message=document.querySelector('#message'),send=document.querySelector('#send'); const add=(role,text)=>{const d=document.createElement('div');d.className='msg '+role;d.textContent=text;messages.appendChild(d);messages.scrollTop=messages.scrollHeight}; const setStatus=t=>status.textContent=t; async function boot(){if(!SUPABASE_URL||!SUPABASE_ANON_KEY){account.textContent='Supabase sozlanmagan';setStatus('app.html ichidagi Supabase qiymatlarini kiriting.');send.disabled=true;return} const {data:{session}}=await supabase.auth.getSession(); if(!session){location.href='auth.html';return} account.textContent=session.user.email||'Foydalanuvchi'; const r=await fetch(API_BASE+'/api/me',{headers:{Authorization:'Bearer '+session.access_token}}); if(!r.ok){setStatus('Profilni olishda xatolik.');return} const j=await r.json(); usage.textContent=(j.profile.plan||'free').toUpperCase()+' · qolgan: '+Math.max(0,(j.profile.monthly_limit-j.profile.usage_count));} document.querySelector('#logout').onclick=async()=>{await supabase.auth.signOut();location.href='auth.html'}; send.onclick=async()=>{const text=message.value.trim();if(!text)return;const {data:{session}}=await supabase.auth.getSession();if(!session)return;add('user',text);message.value='';send.disabled=true;setStatus('Javob tayyorlanmoqda…');try{const r=await fetch(API_BASE+'/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+session.access_token},body:JSON.stringify({message:text})});const j=await r.json();if(!r.ok)throw new Error(j.message||j.error||'Xatolik');add('ai',j.reply);usage.textContent=(j.plan||'').toUpperCase()+' · qolgan: '+j.remaining;setStatus('')}catch(e){add('ai','Xatolik: '+e.message);setStatus('So‘rov bajarilmadi.')}finally{send.disabled=false}}; message.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send.click()}});boot();</script></main></body></html>
